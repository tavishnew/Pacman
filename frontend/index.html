<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Multiplayer</title>
    <meta name="description" content="Play classic Pac-Man in your browser. Solo, multiplayer, and tournament modes with leaderboards and friends.">
    <meta name="theme-color" content="#0a0e27">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'VT323', monospace;
            background: #0a0e27;
            color: #0ff;
            overflow: hidden;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.02),
                rgba(0, 255, 255, 0.02) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 217, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
        }

        p, span, a, button {
            font-family: 'VT323', monospace;
            font-weight: 400;
        }

        button {
            letter-spacing: 1px;
        }

        input, textarea {
            font-family: 'VT323', monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="cursor-glow"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
