<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Multiplayer</title>
    <meta name="description" content="Play classic Pac-Man in your browser. Solo, multiplayer, and tournament modes with leaderboards and friends.">
    <meta name="theme-color" content="#F3EFE3">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Space Mono', 'Courier New', monospace;
            background: #F3EFE3;
            color: #111111;
            overflow: hidden;
            line-height: 1.55;
            letter-spacing: 0.04em;
        }

        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        p, span, a, button {
            font-family: 'Space Mono', 'Courier New', monospace;
            font-weight: 400;
        }

        button {
            letter-spacing: 0.06em;
        }

        input, textarea {
            font-family: 'Space Mono', 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
